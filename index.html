<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#daddc0" />

  <script>
    // Aplica data-brand em document.documentElement de forma síncrona,
    // antes do primeiro paint e antes do React montar, para evitar que a
    // página seja pintada com o contexto visual errado enquanto o
    // BrandProvider/ThemeProvider ainda não correu. Espelha a resolução
    // pública de resolveBrandFromPath em src/app/providers/BrandProvider.jsx.
    (function () {
      var KNOWN_BRAND_IDS = ["group", "sports", "hotel", "travel"];
      var FALLBACK_BRAND_ID = "group";
      var pathSegments = window.location.pathname.split("/").filter(Boolean);
      var resolvedBrandId = FALLBACK_BRAND_ID;

      if (pathSegments[0] === "sunlive-group") {
        var subBrandId = pathSegments[1];

        if (subBrandId && KNOWN_BRAND_IDS.indexOf(subBrandId) !== -1) {
          resolvedBrandId = subBrandId;
        }
      } else {
        var directBrandId = pathSegments[0];

        if (directBrandId && KNOWN_BRAND_IDS.indexOf(directBrandId) !== -1) {
          resolvedBrandId = directBrandId;
        }
      }

      document.documentElement.dataset.brand = resolvedBrandId;
    })();
  </script>

  <title>Sunlive Group — Desporto, Turismo, Educação e Negócio</title>

  <meta name="description"
    content="A Sunlive Group transforma desafios em soluções integradas de desporto, turismo, educação e negócio, com impacto sustentável local e global." />

  <link rel="icon" href="/favicon.webp" type="image/webp" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_PT" />

  <meta property="og:title" content="Sunlive Group — Desporto, Turismo, Educação e Negócio" />

  <meta property="og:description"
    content="Transformamos desafios em soluções com excelência, criando oportunidades sustentáveis e ligações com impacto local e global." />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />

  <meta name="twitter:title" content="Sunlive Group — Desporto, Turismo, Educação e Negócio" />

  <meta name="twitter:description"
    content="Soluções integradas em desporto, turismo, educação e negócio, com impacto sustentável local e global." />
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/app/main.jsx"></script>
</body>

</html>
